<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#100e12" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="Rubber Requiem" />
    <meta property="og:description" content="An endless 1930s rubber-hose arcade run-and-gun: 56 walkable stages, 37 weapons, parries, titans and a travelling shop." />
    <meta property="og:type" content="website" />
    <!-- The tab card is drawn inline: a single-file build has no asset host to fetch from. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23d8c69a'/%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%23f0e3c2' stroke='%23171217' stroke-width='2'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='bold' text-anchor='middle' fill='%23c6483f'%3ER%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="Rubber Requiem — an authentic endless rubber-hose 1930s arcade run-and-gun. 5 playable stars, 37 unique weapons, 40 creeps, 11 atmospheric biomes each with its own telegraphed stage hazard, multi-phase titans, Porbo's traveling shop, parries, EX attacks, and WebGL post-processing shaders." />
    <title>Rubber Requiem — 1930s Rubber-Hose Endless Arcade Run & Gun</title>
  </head>
  <body style="margin:0;background:#100e12">
    <div id="root">
      <!-- Boot fallback: replaced the instant React mounts. If storage, scripts or
           the sandbox kill the boot, this stays visible instead of a white screen. -->
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#100e12;color:#e8ddc7;font-family:Georgia,serif;text-align:center;padding:24px;box-sizing:border-box">
        <div style="font-size:42px;letter-spacing:6px;font-weight:bold;color:#f3e9d2">RUBBER REQUIEM</div>
        <div id="boot-msg" style="opacity:.75;font-size:15px">Warming up the band&hellip; if this message never goes away, something blocked the game from starting.</div>
      </div>
    </div>
    <script>
      // Surface boot-time crashes as text, never as a blank page.
      window.addEventListener("error", function (e) {
        var el = document.getElementById("boot-msg");
        if (el && !window.__rr_booted) el.textContent = "The show hit a snag: " + (e.message || "unknown error");
      });
      window.addEventListener("unhandledrejection", function (e) {
        var el = document.getElementById("boot-msg");
        var r = e.reason;
        if (el && !window.__rr_booted) el.textContent = "The show hit a snag: " + ((r && r.message) || String(r));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
